name: Workflow Wayshub-backend

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-22.04
    environment: development
    steps:
    - name: Checkout SCM
      uses: actions/checkout@v4

    - name: build image
    - run: docker build -t daffaalmaas74/wayshub-backend:development
    
    - name: docker login 
      uses: docker/login-action@v4
      with: 
      - username: ${{ secrets.docker_username }}
      - password: ${{ secrets.docker_token }}
    - name: docker push
      run: docker push daffaalmaas74/wayshub-backend:development
        
    
